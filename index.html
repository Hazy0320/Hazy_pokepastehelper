<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéPaste Generator</title>
    
    <script src="data.js"></script>
    
    <style>
        /* --- 全体の設定 (ベース) --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
        }

        /* --- ヘッダーエリア --- */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* ★ 左上に固定する一括読み込みボタン (sd.png) ★ */
        .header-import-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 9999;
            display: block;
        }
        .header-import-btn:hover {
            transform: scale(1.1);
        }
        .header-logo {
            width: 100%; height: 100%; object-fit: contain;
        }
        /* sd.png の右隣：構築記事を6匹まとめて読み込む */
        .header-team-import-btn {
            position: fixed; top: 20px; left: 73px;
            width: 45px; height: 45px; cursor: pointer;
            transition: transform 0.2s; z-index: 9999; display: block;
        }
        .header-team-import-btn:hover { transform: scale(1.1); }
        .header-team-import-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
        @media (max-width: 520px) {
            .header-import-btn { top: 12px; left: 12px; width: 38px; height: 38px; }
            .header-team-import-btn { top: 12px; left: 58px; width: 38px; height: 38px; }
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin: 0; padding: 0;
        }

        /* --- 個別インポートボタン (45px x 45px) --- */
        .individual-import-btn {
            position: absolute; top: 20px; right: 20px;
            width: 45px; height: 45px; cursor: pointer;
            transition: transform 0.2s; z-index: 5;
        }
        .individual-import-btn:hover, .tettei-import-btn:hover { transform: scale(1.1); }
        .individual-import-btn:active, .tettei-import-btn:active { transform: scale(0.95); }
        .individual-import-btn { right: 20px; }
        .tettei-import-btn {
            position: absolute; top: 20px; right: 73px;
            width: 45px; height: 45px; cursor: pointer;
            transition: transform 0.2s; z-index: 5;
        }
        .tettei-import-btn img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            border-radius: 0; border: none;
            box-shadow: none; background: transparent;
        }

        .import-btn-img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 50%; border: 2px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); background-color: #fff;
            display: block;
        }
        .import-btn-img:hover { border-color: #2a64a3; }
        
        .import-fallback {
            width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(135deg, #2a64a3, #4a90e2);
            color: white; font-size: 18px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* --- モーダルウィンドウ --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 16px;
            width: 90%; max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center; animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .modal-textarea {
            width: 100%; height: 200px; padding: 15px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-family: monospace; font-size: 14px;
            box-sizing: border-box; resize: vertical; margin: 20px 0;
            background: #f9f9f9;
        }
        .modal-textarea:focus { border-color: #2a64a3; outline: none; background: #fff; }
        
        .modal-btn-group { display: flex; gap: 15px; justify-content: center; }
        .modal-btn {
            padding: 12px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;
            transition: background 0.2s;
        }
        .btn-cancel { background: #f0f0f0; color: #555; }
        .btn-cancel:hover { background: #e0e0e0; }
        .btn-import { background: #2a64a3; color: white; }
        .btn-import:hover { background: #1e4b7a; }

        /* --- 下部ボタン --- */
        .btn {
            display: block; width: 100%; padding: 16px;
            font-weight: bold; color: white; border: none; border-radius: 8px;
            cursor: pointer; margin-top: 15px; font-size: 16px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        #generate-button { background-color: #2a64a3; margin-top: 40px; box-shadow: 0 4px 15px rgba(42, 100, 163, 0.3); }
        #copy-button { background-color: #2da382; box-shadow: 0 4px 15px rgba(45, 163, 130, 0.3); }
        
        #output-code {
            width: 100%; height: 300px; padding: 20px;
            border: 2px solid #eee; border-radius: 8px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px; resize: vertical;
            background: #fdfdfd; box-sizing: border-box; margin-top: 20px;
            line-height: 1.4; color: #333;
        }

        /* エラー表示 */
        #status-bar { padding: 15px; margin-bottom: 20px; border-radius: 8px; font-weight: bold; font-size: 14px; display: none; text-align: center; }
        .status-warn { background-color: #fff8e1; color: #f57f17; border: 1px solid #ffecb3; }
        .status-error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

        /* --- 入力フォーム (指定CSS) --- */
        .pokemon-section {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
            padding-top: 40px;
            margin-bottom: 30px;
            background: #fff;
            position: relative;
        }
        .pokemon-section h2 {
            color: #333;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-group label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #666; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 10px 12px;
            border: 1px solid #ddd; border-radius: 6px;
            box-sizing: border-box; font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #2a64a3; outline: none;
        }

        /* 努力値・個体値 */
        .stats-container {
            display: flex; gap: 15px; margin: 20px 0;
            background: #f8f9fa; padding: 15px; border-radius: 8px;
        }
        .stats-block { flex: 1; }
        
        /* 努力値タイトルの微調整 (合計表示用) */
        .stats-block h3 { 
            margin: 0 0 10px 0; font-size: 13px; color: #888; text-align: center; 
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        
        .stat-input-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
        .stat-item { text-align: center; }
        .stat-item label { font-size: 11px; color: #aaa; display: block; margin-bottom: 2px; }
        .stat-item input { text-align: center; padding: 5px; font-size: 13px; }

        /* 技 */
        .move-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* ★ レスポンシブ対応 (画面幅600px以下で適用) ★ */
        @media (max-width: 600px) {
            .stats-container {
                flex-direction: column;
            }
            .container {
                padding: 20px;
            }
        }

    </style>
</head>
<body>

    <div id="open-pokepaste-btn" class="header-import-btn" title="PokéPaste(英語)を一括読み込み">
        <img src="sd.png" alt="Paste" class="header-logo">
    </div>
    <div id="open-pokesol-team-btn" class="header-team-import-btn" title="ポケソルの構築記事から6匹を一括読み込み">
        <img src="image.png" alt="ポケソル構築記事読み込み">
    </div>

    <div class="container">
        <h1>PokéPaste Generator</h1>
        
        <div id="status-bar"></div>

        <div class="mode-panel" style="margin:20px 0;padding:16px;background:#f3f7fc;border:1px solid #d7e3f3;border-radius:10px;">
<label for="training-mode" style="display:block;font-weight:bold;margin-bottom:8px;color:#2a64a3;">育成方式</label>
<select id="training-mode" style="width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:6px;font-size:15px;">
<option value="standard">通常作品（努力値：合計510 / 各252）</option>
<option value="champions">Pokémon Champions（能力ポイント：合計66 / 各32）</option>
</select>
<p id="mode-help" style="font-size:12px;color:#5d6b7a;margin:8px 0 0;">通常のPokéPaste形式で出力します。</p>
</div>
<form id="pokepaste-form"></form>
        
        <button type="button" id="generate-button" class="btn">PokéPasteコードを生成</button>
        <textarea id="output-code" readonly placeholder="生成結果がここに表示されます..."></textarea>
        <button type="button" id="copy-button" class="btn">クリップボードにコピー</button>
    </div>

    <div class="modal-overlay" id="import-modal">
        <div class="modal-content">
            <h3 id="modal-title">テキスト読み込み</h3>
            <p id="modal-desc" style="font-size:13px; color:#666;">テキストを入力してください</p>
            <textarea class="modal-textarea" id="import-text" placeholder=""></textarea>
            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" id="close-modal">キャンセル</button>
                <button class="modal-btn btn-import" id="run-import">読み込む</button>
            </div>
        </div>
    </div>

    <datalist id="list-pokemon"></datalist>
    <datalist id="list-items"></datalist>
    <datalist id="list-abilities"></datalist>
    <datalist id="list-natures"></datalist>
    <datalist id="list-types"></datalist>
    <datalist id="list-moves"></datalist>

    <script>
        // === 1. 初期設定 & データ統合 ===
        const FALLBACK_TYPES = {
            "ノーマル": "Normal", "ほのお": "Fire", "みず": "Water", "くさ": "Grass", "でんき": "Electric",
            "こおり": "Ice", "かくとう": "Fighting", "どく": "Poison", "じめん": "Ground", "ひこう": "Flying",
            "エスパー": "Psychic", "むし": "Bug", "いわ": "Rock", "ゴースト": "Ghost", "ドラゴン": "Dragon",
            "あく": "Dark", "はがね": "Steel", "フェアリー": "Fairy", "ステラ": "Stellar"
        };
        const FALLBACK_NATURES = {
            "いじっぱり": "Adamant", "ようき": "Jolly", "ひかえめ": "Modest", "おくびょう": "Timid",
            "ゆうかん": "Brave", "れいせい": "Quiet", "なまいき": "Sassy", "のんき": "Relaxed",
            "ずぶとい": "Bold", "わんぱく": "Impish", "おだやか": "Calm", "しんちょう": "Careful"
        };

        // 性格補正データ (表示用)
        const NATURE_STATS = {
            "さみしがり": "(A↑ B↓)", "いじっぱり": "(A↑ C↓)", "やんちゃ": "(A↑ D↓)", "ゆうかん": "(A↑ S↓)",
            "ずぶとい": "(B↑ A↓)", "わんぱく": "(B↑ C↓)", "のうてんき": "(B↑ D↓)", "のんき": "(B↑ S↓)",
            "ひかえめ": "(C↑ A↓)", "おっとり": "(C↑ B↓)", "うっかりや": "(C↑ D↓)", "れいせい": "(C↑ S↓)",
            "おだやか": "(D↑ A↓)", "おとなしい": "(D↑ B↓)", "しんちょう": "(D↑ C↓)", "なまいき": "(D↑ S↓)",
            "おくびょう": "(S↑ A↓)", "せっかち": "(S↑ B↓)", "ようき": "(S↑ C↓)", "むじゃき": "(S↑ D↓)",
            "てれや": "", "がんばりや": "", "すなお": "", "きまぐれ": "", "まじめ": ""
        };

        // 逆引き用辞書 (英語 -> 日本語)
        let REVERSE_DATA = { pokemon:{}, items:{}, abilities:{}, natures:{}, types:{}, moves:{} };

        window.addEventListener('load', () => {
            const statusEl = document.getElementById('status-bar');
            if (typeof TRANSLATION_DATA === 'undefined') {
                statusEl.style.display = 'block';
                statusEl.className = 'status-error';
                statusEl.innerHTML = `⚠️ 辞書ファイル (data.js) が読み込めません。<br>ファイル名やフォルダの場所を確認してください。`;
                window.TRANSLATION_DATA = { pokemon:{}, moves:{}, abilities:{}, items:{}, natures:{}, types:{} };
            } else {
                normalizeAndMergeData();
                createReverseData(); // 逆引き辞書の作成
                setupAutocomplete();
                statusEl.style.display = 'none';
            }
        });

        function normalizeAndMergeData() {
            if (!TRANSLATION_DATA.items && TRANSLATION_DATA.Items) TRANSLATION_DATA.items = TRANSLATION_DATA.Items;
            if (!TRANSLATION_DATA.items && TRANSLATION_DATA.item) TRANSLATION_DATA.items = TRANSLATION_DATA.item;
            if (!TRANSLATION_DATA.types && TRANSLATION_DATA.Types) TRANSLATION_DATA.types = TRANSLATION_DATA.Types;

            // カテゴリ名のゆらぎ吸収
            if (!TRANSLATION_DATA.abilities && TRANSLATION_DATA.ability) TRANSLATION_DATA.abilities = TRANSLATION_DATA.ability;
            if (!TRANSLATION_DATA.natures && TRANSLATION_DATA.nature) TRANSLATION_DATA.natures = TRANSLATION_DATA.nature;
            if (!TRANSLATION_DATA.types && TRANSLATION_DATA.type) TRANSLATION_DATA.types = TRANSLATION_DATA.type;

            const keys = ['pokemon', 'moves', 'abilities', 'items', 'natures', 'types'];
            keys.forEach(key => {
                const otherKey = key + '_other';
                if (TRANSLATION_DATA[otherKey]) {
                    if (!TRANSLATION_DATA[key]) TRANSLATION_DATA[key] = {};
                    Object.assign(TRANSLATION_DATA[key], TRANSLATION_DATA[otherKey]);
                }
            });
            
            if (!TRANSLATION_DATA.types || Object.keys(TRANSLATION_DATA.types).length === 0) TRANSLATION_DATA.types = FALLBACK_TYPES;
            if (!TRANSLATION_DATA.natures || Object.keys(TRANSLATION_DATA.natures).length === 0) TRANSLATION_DATA.natures = FALLBACK_NATURES;
            if (!TRANSLATION_DATA.items) TRANSLATION_DATA.items = {};
            if (!TRANSLATION_DATA.moves) TRANSLATION_DATA.moves = {};
            if (!TRANSLATION_DATA.abilities) TRANSLATION_DATA.abilities = {};
            if (!TRANSLATION_DATA.pokemon) TRANSLATION_DATA.pokemon = {};
        }

        // 逆引き辞書を作る関数
        function createReverseData() {
            const categories = ['pokemon', 'items', 'abilities', 'natures', 'types', 'moves'];
            categories.forEach(cat => {
                const src = TRANSLATION_DATA[cat];
                if(src) {
                    Object.keys(src).forEach(jpKey => {
                        const enVal = src[jpKey];
                        if(enVal) {
                            REVERSE_DATA[cat][enVal.toLowerCase()] = jpKey;
                        }
                    });
                }
            });
        }

        // 逆引き検索関数 (英語 -> 日本語)
        function reverseTranslate(text, type) {
            if(!text) return '';
            const dict = REVERSE_DATA[type];
            const key = text.toLowerCase();
            if(dict && dict[key]) return dict[key];
            return text;
        }

        function setupAutocomplete() {
            createOptions('list-pokemon', TRANSLATION_DATA.pokemon);
            createOptions('list-items', TRANSLATION_DATA.items);
            createOptions('list-abilities', TRANSLATION_DATA.abilities);
            createOptions('list-natures', TRANSLATION_DATA.natures, 'natures');
            createOptions('list-types', TRANSLATION_DATA.types);
            createOptions('list-moves', TRANSLATION_DATA.moves);
        }

        function createOptions(listId, dataObj, category) {
            const list = document.getElementById(listId);
            list.innerHTML = '';
            const sortedKeys = Object.keys(dataObj).sort();
            sortedKeys.forEach(key => {
                const option = document.createElement('option');
                let displayValue = key;
                if (category === 'natures' && NATURE_STATS[key]) {
                    displayValue += " " + NATURE_STATS[key];
                }
                option.value = displayValue;
                list.appendChild(option);
            });
        }

        // === 2. フォーム生成 ===
        const form = document.getElementById('pokepaste-form');
        const STAT_LABELS = ['H', 'A', 'B', 'C', 'D', 'S'];
        const STAT_MAP = {'H':'HP', 'A':'Atk', 'B':'Def', 'C':'SpA', 'D':'SpD', 'S':'Spe'};
        const REV_STAT_MAP = {'HP':'H', 'Atk':'A', 'Def':'B', 'SpA':'C', 'SpD':'D', 'Spe':'S'};
        
        let currentTargetIndex = 1;
        let currentMode = 'individual'; // 'individual' or 'bulk_pokepaste'

        for (let i = 1; i <= 6; i++) {
            const section = document.createElement('div');
            section.className = 'pokemon-section';
            
            let evInputs = '';
            STAT_LABELS.forEach(stat => {
                const ph = (stat === 'H' || stat === 'A') ? '252' : '0';
                evInputs += `<div class="stat-item"><label>${stat}</label><input type="number" class="ev-input" name="ev-${stat}-${i}" placeholder="${ph}" min="0" max="252" step="4"></div>`;
            });

            let ivInputs = '';
            STAT_LABELS.forEach(stat => {
                ivInputs += `<div class="stat-item"><label>${stat}</label><input type="number" class="iv-input" name="iv-${stat}-${i}" value="31" min="0" max="31"></div>`;
            });

            section.innerHTML = `
                <div class="individual-import-btn" onclick="openModal(${i}, 'individual')" title="ポケソルテキストを読み込む">
                    <img src="image.png" alt="テキスト読み込み" class="import-btn-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="import-fallback" style="display:none;">📋</div>
                </div>
                <div class="tettei-import-btn" onclick="openModal(${i}, 'yakkun')" title="ポケ徹の育成論URLから自動入力">
                    <img src="tettei.png" alt="ポケ徹から読み込み" onerror="this.style.display='none'; this.parentElement.textContent='徹'; this.parentElement.style.cssText+=';display:flex;align-items:center;justify-content:center;background:#c62828;color:white;border-radius:0;font-weight:bold;'">
                </div>

                <h2>ポケモン ${i}</h2>
                
                <div class="form-group">
                    <label>ポケモン名 *</label>
                    <input type="text" id="name-${i}" list="list-pokemon" placeholder="例: カイリュー">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>特性</label>
                        <input type="text" id="ability-${i}" list="list-abilities" placeholder="例: マルチスケイル">
                    </div>
                    <div class="form-group">
                        <label>持ち物</label>
                        <input type="text" id="item-${i}" list="list-items" placeholder="例: こだわりハチマキ">
                    </div>
                    <div class="form-group">
                        <label>性格</label>
                        <input type="text" id="nature-${i}" list="list-natures" placeholder="例: いじっぱり">
                    </div>
                    <div class="form-group">
                        <label>テラスタイプ</label>
                        <input type="text" id="tera-${i}" list="list-types" placeholder="例: ノーマル">
                    </div>
                </div>

                <div class="stats-container">
                    <div class="stats-block">
                        <h3><span class="ev-heading">努力値 (EVs)</span> <span id="ev-total-${i}" style="font-size:0.85em; font-weight:normal; margin-left:5px; color:#aaa;">(0/510)</span></h3>
                        <div class="stat-input-grid">${evInputs}</div>
                    </div>
                    <div class="stats-block"><h3>個体値 (IVs)</h3><div class="stat-input-grid">${ivInputs}</div></div>
                </div>
                <div class="form-group"><label>技構成 *</label>
                    <div class="move-grid">
                        <input type="text" id="move-1-${i}" list="list-moves" placeholder="技1">
                        <input type="text" id="move-2-${i}" list="list-moves" placeholder="技2">
                        <input type="text" id="move-3-${i}" list="list-moves" placeholder="技3">
                        <input type="text" id="move-4-${i}" list="list-moves" placeholder="技4">
                    </div>
                </div>
            `;
            form.appendChild(section);
        }

        // === 3. インポート機能 ===
        const modal = document.getElementById('import-modal');
        const closeBtn = document.getElementById('close-modal');
        const runBtn = document.getElementById('run-import');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const importText = document.getElementById('import-text');

        window.openModal = function(index, mode) {
            currentMode = mode;
            currentTargetIndex = index;
            importText.value = '';

            if (mode === 'bulk_pokepaste') {
                modalTitle.textContent = "PokéPaste一括読み込み";
                modalDesc.textContent = "英語のPokéPasteテキストを貼り付けてください（最大6匹まで）";
                importText.placeholder = "Dragonite @ Choice Band\nAbility: Multiscale\n...";
            } else if (mode === 'pokesol_bulk') {
                modalTitle.textContent = "ポケソル構築記事から6匹を一括読み込み";
                modalDesc.textContent = "ポケノート（pokesol.app）の構築記事URLを貼り付けてください。r.jina.ai経由で本文を取得し、読み取れた個体情報を6枠に反映します。記事が画像だけで構成されている項目は自動取得できない場合があります。";

        // ポケソル構築記事を r.jina.ai 経由で取得し、本文にテキスト化された6匹分のセットを解析
        async function fetchPokesolTeamArticle(inputUrl) {
            let url;
            try { url = new URL(inputUrl); } catch (_) { throw new Error('URLの形式が正しくありません'); }
            if (url.hostname !== 'pokesol.app' || !/^\/u\/[a-zA-Z0-9_-]+\/articles\/[a-zA-Z0-9_-]+\/?$/.test(url.pathname)) {
                throw new Error('https://pokesol.app/u/ユーザー名/articles/記事ID のURLを指定してください');
            }
            const proxyUrl = 'https://r.jina.ai/https://' + url.hostname + url.pathname + url.search;
            const response = await fetch(proxyUrl, { headers: { 'Accept': 'text/plain' } });
            if (!response.ok) throw new Error(`取得先からHTTP ${response.status}が返りました`);
            const article = await response.text();
            if (!article || !/ポケノート|構築記事|個体紹介|Pok[eé]mon|Markdown Content/i.test(article)) {
                throw new Error('記事本文を認識できませんでした');
            }

            // 記事本文にPokéPaste/セットのテキストが埋め込まれている場合を優先して解析
            const normalized = article.replace(/\r/g, '').replace(/\u00a0/g, ' ');
            let sets = extractPokesolSets(normalized);
            return { sets: sets.slice(0, 6), source: url.href, article: normalized };
        }

        function extractPokesolSets(article) {
            // ポケソルのMarkdown本文は「### ポケモン名」ごとに個体情報が並ぶ形式を優先して解析する。
            // 例: タイプ / 特性 性格 / 持ち物 / 技4つ / H A B C D S の実数値行と配分行
            const normalized = article.replace(/\r/g, '').replace(/\u00a0/g, ' ');
            const headings = [...normalized.matchAll(/^###\s+(.+?)\s*$/gm)];
            const results = [];
            const natureNames = (typeof NATURE_STATS !== 'undefined' && NATURE_STATS)
                ? Object.keys(NATURE_STATS).sort((a, b) => b.length - a.length)
                : ['いじっぱり','ようき','ひかえめ','おくびょう','ずぶとい','わんぱく','のんき','しんちょう','おだやか','れいせい','ゆうかん','なまいき','せっかち','むじゃき','さみしがり','やんちゃ','おっとり','うっかりや','てれや','がんばりや','すなお','きまぐれ','まじめ'];

            if (headings.length) {
                headings.forEach((heading, index) => {
                    const section = normalized.slice(heading.index + heading[0].length, index + 1 < headings.length ? headings[index + 1].index : normalized.length);
                    const lines = section.split('\n').map(line => line.trim()).filter(Boolean);
                    const clean = value => value.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`]/g, '').trim();
                    let name = clean(heading[1]).replace(/\s*[（(].*?[）)]\s*/g, '').trim();
                    // メガシンカ名は入力フォーム上では通常のポケモン名＋メガストーンとして扱う。
                    name = name.replace(/^メガ/, '').replace(/[XZＸＺ]$/, '').trim();
                    if (!name) return;

                    let ability = '', nature = '', item = '';
                    const typeLine = lines.find(line => /^(?:ノーマル|ほのお|みず|でんき|くさ|こおり|かくとう|どく|じめん|ひこう|エスパー|むし|いわ|ゴースト|ドラゴン|あく|はがね|フェアリー)(?:\s|$)/.test(line));
                    for (const line of lines) {
                        const plain = clean(line).replace(/\|/g, ' ').trim();
                        const foundNature = natureNames.find(n => new RegExp('(?:^|\\s)' + n + '(?:$|\\s)').test(plain));
                        if (foundNature) {
                            nature = foundNature;
                            ability = plain.replace(new RegExp('(?:^|\\s)' + foundNature + '(?:$|\\s)'), ' ').trim();
                            ability = ability.replace(/\s+/g, ' ').trim();
                            break;
                        }
                    }
                    // 持ち物は画像のalt文字列を優先し、なければ画像直後のテキストを使う。
                    const itemLine = lines.find(line => /!\[[^\]]+\]\([^)]*\/items\/|リザードナイト|ナイト[XYZ]|\b(?:オボンのみ|きあいのタスキ|いのちのたま)\b/.test(line));
                    if (itemLine) {
                        const alt = itemLine.match(/!\[([^\]]+)\]\(/);
                        const altText = alt ? alt[1].replace(/^Image\s*\d*\s*:\s*/i, '').trim() : '';
                        const afterImage = itemLine.replace(/!\[[^\]]*\]\([^)]*\)/g, '').trim();
                        item = altText || clean(afterImage);
                    }
                    if (!item) {
                        const itemIndex = lines.findIndex(line => /\/items\//i.test(line));
                        if (itemIndex >= 0) item = clean(lines[itemIndex]);
                    }

                    // Markdown表の2行目（実数値）の次にある行が、Championsの能力ポイント配分。
                    const tableRows = lines.filter(line => /^\|.*\|$/.test(line)).map(line => line.split('|').slice(1, -1).map(cell => cell.trim()));
                    let points = null;
                    for (let rowIndex = 0; rowIndex < tableRows.length - 1; rowIndex++) {
                        const header = tableRows[rowIndex].map(x => x.toUpperCase());
                        if (['H','A','B','C','D','S'].every(stat => header.includes(stat))) {
                            const next = tableRows.slice(rowIndex + 1).find(row => row.length >= 6 && row.slice(0, 6).every(cell => /^(?:\d+|—|-|–)$/.test(cell)));
                            const following = next && tableRows[tableRows.indexOf(next) + 1];
                            // 罫線行を飛ばして、6列の数値/ダッシュ行を探す
                            const candidateRows = tableRows.slice(rowIndex + 1).filter(row => row.length >= 6 && row.slice(0, 6).every(cell => /^(?:\d+|—|-|–)$/.test(cell)));
                            if (candidateRows.length >= 2) {
                                const vals = candidateRows[1].slice(0, 6).map(v => /^(?:—|-|–)$/.test(v) ? 0 : Number(v));
                                points = { H: vals[0], A: vals[1], B: vals[2], C: vals[3], D: vals[4], S: vals[5] };
                            }
                            break;
                        }
                    }

                    // 見出し・タイプ・特性/性格・持ち物・表を除いた最初の4行を技として読む。
                    const moves = [];
                    let afterItem = false;
                    for (const rawLine of lines) {
                        if (rawLine === itemLine) { afterItem = true; continue; }
                        if (/^\|/.test(rawLine)) break;
                        if (!afterItem) continue;
                        const move = clean(rawLine).replace(/!\[[^\]]*\]\([^)]*\)/g, '').trim();
                        if (!move || move === item || /^(?:ほのお|みず|くさ|でんき|こおり|かくとう|どく|じめん|ひこう|エスパー|むし|いわ|ゴースト|ドラゴン|あく|はがね|フェアリー|ノーマル)(?:\s|$)/.test(move)) continue;
                        if (natureNames.some(n => move.includes(n)) || /^(?:かたいツメ|もうか|サンパワー|テクニシャン|いかく|ふゆう|げきりゅう|さめはだ|ばけのかわ|さいせいりょく)\s/.test(move)) continue;
                        if (/^読み込み元/.test(move)) continue;
                        moves.push(move);
                        if (moves.length === 4) break;
                    }

                    // セットとして使える最低条件。見出しだけの目次などを除外する。
                    if (item || moves.length || points || ability || nature) {
                        results.push({ name, item, ability, nature, moves, points, sourceType: 'pokesol-markdown' });
                    }
                });
            }
            if (results.length) return results;

            // 記事内に一般的なPokéPaste形式がある場合のフォールバック
            const fallback = [];
            const seen = new Set();
            let block = [];
            const flush = () => {
                if (!block.length) return;
                const text = block.join('\n').trim(); block = [];
                if (!text || !/(?:@|持ち物[:：]|特性[:：]|Ability:|性格[:：]|Nature:|EVs:|Moves?:)/i.test(text)) return;
                const first = text.split('\n').find(line => /@|持ち物[:：]/.test(line));
                if (!first) return;
                const name = first.split('@')[0].trim().replace(/^[-*#>\s]+/, '');
                if (!name || seen.has(name)) return;
                seen.add(name); fallback.push({ text, name });
            };
            for (const line of normalized.split('\n')) {
                if (!line.trim()) { flush(); continue; }
                if (/(?:@\s*[^@]+|持ち物[:：]\s*[^\n]+)/.test(line.trim()) && block.length) flush();
                block.push(line);
            }
            flush();
            return fallback;
        }

        // ポケ徹の育成論を r.jina.ai 経由で取得（GitHub Pages等の静的サイト向け）
        async function fetchYakkunTheory(inputUrl) {
            let url;
            try { url = new URL(inputUrl); } catch (_) { throw new Error('URLの形式が正しくありません'); }
            if (url.hostname !== 'yakkun.com' || !/^\/ch\/theory\/n\d+/.test(url.pathname)) {
                throw new Error('https://yakkun.com/ch/theory/n数字 の育成論URLを指定してください');
            }
            const proxyUrl = 'https://r.jina.ai/https://' + url.hostname + url.pathname + url.search;
            const response = await fetch(proxyUrl, { headers: { 'Accept': 'text/plain', 'X-Respond-With': 'text' } });
            if (!response.ok) throw new Error(`取得先からHTTP ${response.status}が返りました`);
            const text = await response.text();
            if (!text || !/能力ポイント|育成論|メガサーナイト/.test(text)) throw new Error('ページ内容を認識できませんでした');
            const get = (regex, group=1) => { const m = text.match(regex); return m ? (m[group] || '').trim() : ''; };
            const lines = text.split(/\r?\n/).map(line => line.trim());
            const name = get(/^\*\*([^*]+)\*\*!\[Image/m)
                || get(/^## \[([^\]]+)\]\(/m)
                || get(/^([^\n]+?)\s*-\s*ポケモンチャンピオンズ育成論\s*$/m)
                || get(/(?:ポケモン名|ポケモン)[:：]\s*([^\n]+)/);
            const nature = get(/性格\[([^\]]+)\]\([^)]*\)\s*\(([^)]*)\)/) || get(/性格\[([^\]]+)\]\([^)]*\)/);
            let natureName = nature ? nature.split(')')[0].trim() : '';
            if (!natureName) {
                const natureIndex = lines.findIndex(line => /^性格\s*$/.test(line) || /^性格[:：]/.test(line));
                if (natureIndex >= 0) {
                    natureName = (lines[natureIndex].match(/^性格[:：]\s*(.+)$/)?.[1] || lines.slice(natureIndex + 1).find(line => line && !/^特性$/.test(line)) || '').split(/[（(]/)[0].trim();
                }
            }
            const ability = get(/特性\[([^\]]+)\]\(/) || (() => {
                const i = lines.findIndex(line => /^特性\s*$/.test(line) || /^特性[:：]/.test(line));
                return i >= 0 ? ((lines[i].match(/^特性[:：]\s*(.+)$/)?.[1]) || lines.slice(i + 1).find(line => line && !/^能力ポイント/.test(line)) || '').trim() : '';
            })();
            const item = get(/持ち物\[([^\]]+)\]\(/) || (() => {
                const moveHeading = lines.findIndex(line => line === '覚えさせる技');
                const i = lines.findIndex((line, n) => n > moveHeading && (line === '持ち物' || /^持ち物[:：]/.test(line)));
                if (i < 0) return '';
                return (lines[i].match(/^持ち物[:：]\s*(.+)$/)?.[1] || lines.slice(i + 1).find(line => line && line !== 'スポンサーリンク') || '').trim();
            })();
            const points = {};
            const pointHeading = text.search(/能力ポイント[（(]?努力値配分/);
            if (pointHeading >= 0) {
                const afterHeading = text.slice(pointHeading).split(/\r?\n/).slice(1, 8);
                const pointLine = afterHeading.find(line => !/0-252表示|実数値/.test(line) && /(HP|攻撃|防御|特攻|特防|素早さ?|素早)\s*[:：]\s*\d+/.test(line)) || '';
                const pointRegex = /(HP|攻撃|防御|特攻|特防|素早さ?|素早)\s*[:：]\s*(\d+)/g;
                let pm;
                while ((pm = pointRegex.exec(pointLine))) {
                    const key = ({'HP':'H','攻撃':'A','防御':'B','特攻':'C','特防':'D','素早':'S','素早さ':'S'})[pm[1]];
                    if (key) points[key] = Number(pm[2]);
                }
            }
            // 「覚えさせる技」から「ルール」までの範囲で、技名の直後に威力・命中・PPが並ぶ形式を読む。
            // 威力や命中は数値だけでなく「-」「—」などの場合もある。
            const moves = [];
            const moveHeading = lines.findIndex(line => /^覚えさせる技$/.test(line));
            const ruleHeading = lines.findIndex((line, i) => i > moveHeading && /^ルール(?:\s|$)/.test(line));
            if (moveHeading >= 0 && ruleHeading > moveHeading) {
                const isMoveStat = value => /^(?:\d+(?:\.\d+)?|[-—–－ー])$/.test((value || '').trim());
                const cleanMoveName = value => value
                    .replace(/\*\*/g, '')
                    .replace(/^!\[[^\]]*\]\([^)]*\)/, '')
                    .replace(/^\[([^\]]+)\]\([^)]*\)$/, '$1')
                    .replace(/\s+/g, ' ')
                    .trim();
                for (let i = moveHeading + 1; i + 3 < ruleHeading && moves.length < 4; i++) {
                    // 技名 + 威力 + 命中 + PP の4行が揃っているものだけを技として扱う。
                    if (isMoveStat(lines[i+1]) && isMoveStat(lines[i+2]) && isMoveStat(lines[i+3])) {
                        const move = cleanMoveName(lines[i]);
                        if (move && !/^(威力|命中|PP|覚えさせる技)$/.test(move) && !moves.includes(move)) {
                            moves.push(move);
                        }
                    }
                }
            }
            // ページ形式が異なる場合だけ、「技構成」の番号付き一覧を予備として使う。
            if (moves.length < 4) {
                const natureSectionIndex = lines.findIndex(line => line.includes('性格・努力値と調整'));
                let techSectionIndex = -1;
                for (let i = Math.max(0, natureSectionIndex); i < lines.length; i++) {
                    if (lines[i] === '技構成') { techSectionIndex = i; break; }
                }
                if (techSectionIndex >= 0) {
                    for (let i = techSectionIndex + 1; i < lines.length && !/^(立ち回り例|与ダメージ計算|被ダメージ計算|苦手なポケモン|相性の良い味方)/.test(lines[i]) && moves.length < 4; i++) {
                        const numbered = lines[i].match(/^\d+[.．、]\s*(.+)$/);
                        if (!numbered) continue;
                        const move = numbered[1]
                            .replace(/\*\*/g, '')
                            .replace(/\s+(?:特殊|物理|変化)\b.*$/, '')
                            .replace(/\s+命中\s*(?:\d+|-|—|–|－|ー).*$/, '')
                            .replace(/\s+威力\s*(?:\d+|-|—|–|－|ー).*$/, '')
                            .trim();
                        if (move && !moves.includes(move)) moves.push(move);
                    }
                }
            }
            // ページによっては本文の「H32 A…」表記のみの場合も拾う
            if (!Object.keys(points).length) {
                const compact = text.match(/\bH\s*\d+\s+A\s*\d+\s+B\s*\d+\s+C\s*\d+\s+D\s*\d+\s+S\s*\d+/);
                if (compact) compact[0].replace(/([HABCDS])\s*(\d+)/g, (_, k, v) => { points[k] = Number(v); });
            }
            if (!name && !Object.keys(points).length && !natureName) throw new Error('育成論のデータ（ポケモン名・配分など）が見つかりませんでした');
            return { name, nature: natureName, ability, item, points, moves, source: url.href };
        }

        function fillFromYakkunTheory(data, idx) {
            // Championsの能力ポイント方式へ自動切替
            trainingMode.value = 'champions';
            updateTrainingModeUI();
            if (data.name) document.getElementById(`name-${idx}`).value = data.name;
            if (data.ability) document.getElementById(`ability-${idx}`).value = data.ability;
            if (data.item) document.getElementById(`item-${idx}`).value = data.item;
            if (data.nature) {
                const natureStats = { 'いじっぱり':'攻撃↑ 特攻↓','ひかえめ':'特攻↑ 攻撃↓','ようき':'素早↑ 特攻↓','おくびょう':'素早↑ 攻撃↓','むじゃき':'素早↑ 特防↓','せっかち':'素早↑ 防御↓','ずぶとい':'防御↑ 攻撃↓','わんぱく':'防御↑ 特攻↓','のんき':'防御↑ 素早↓','のうてんき':'防御↑ 特防↓','しんちょう':'特防↑ 特攻↓','おだやか':'特防↑ 攻撃↓','なまいき':'特防↑ 素早↓','ゆうかん':'攻撃↑ 素早↓','れいせい':'特攻↑ 素早↓','おっとり':'特攻↑ 防御↓','うっかりや':'特攻↑ 特防↓','さみしがり':'攻撃↑ 防御↓','やんちゃ':'攻撃↑ 特防↓','まじめ':'補正なし','てれや':'補正なし','すなお':'補正なし','きまぐれ':'補正なし','がんばりや':'補正なし','きょうせい':'補正なし' };
                document.getElementById(`nature-${idx}`).value = data.nature + (natureStats[data.nature] ? ' ' + natureStats[data.nature] : '');
            }
            STAT_LABELS.forEach(stat => {
                const input = document.querySelector(`input[name="ev-${stat}-${idx}"]`);
                input.value = data.points[stat] !== undefined ? data.points[stat] : 0;
            });
            updateEVTotal(idx);
            for (let m=1; m<=4; m++) document.getElementById(`move-${m}-${idx}`).value = data.moves[m-1] || '';
            // 出典URLを控えめに表示
            let note = document.getElementById(`yakkun-source-${idx}`);
            if (!note) {
                note = document.createElement('a'); note.id = `yakkun-source-${idx}`;
                note.target = '_blank'; note.rel = 'noopener noreferrer'; note.style.cssText = 'display:block;font-size:12px;margin-top:8px;color:#2a64a3;word-break:break-all;';
                document.querySelector(`#name-${idx}`).closest('.pokemon-section').appendChild(note);
            }
            note.href = data.source; note.textContent = '読み込み元：ポケ徹の育成論';
        }

        const trainingMode = document.getElementById('training-mode');
        function isChampionsMode() { return trainingMode.value === 'champions'; }
        function updateTrainingModeUI() {
            const champions = isChampionsMode();
            document.getElementById('mode-help').textContent = champions
                ? 'Champions用の能力ポイント配分です。各能力0〜32、合計66まで。出力はPokéPasteではなくChampions用メモ形式になります。'
                : '通常のPokéPaste形式で出力します。努力値は合計510、各能力252までです。';
            document.querySelectorAll('.ev-input').forEach(input => {
                input.max = champions ? 32 : 252;
                input.step = champions ? 1 : 4;
                input.placeholder = champions ? '0' : ((input.name.includes('-H-') || input.name.includes('-A-')) ? '252' : '0');
                const idx = input.name.split('-')[2];
                const val = parseInt(input.value) || 0;
                if (val > (champions ? 32 : 252)) input.value = champions ? 32 : 252;
                updateEVTotal(idx);
            });
            document.querySelectorAll('.ev-heading').forEach(el => el.textContent = champions ? '能力ポイント (Champions)' : '努力値 (EVs)');
            document.querySelectorAll('.iv-input').forEach(input => {
                input.disabled = champions;
                input.title = champions ? 'Championsでは個体値入力を使用しません' : '';
            });
            document.querySelectorAll('.stats-block').forEach((block, i) => {
                if (i === 1) block.style.opacity = champions ? '0.45' : '1';
            });
        }
        trainingMode.addEventListener('change', updateTrainingModeUI);

        // ★ 努力値合計を更新する関数
        function updateEVTotal(idx) {
            let total = 0;
            STAT_LABELS.forEach(stat => {
                const val = document.querySelector(`input[name="ev-${stat}-${idx}"]`).value;
                total += parseInt(val) || 0;
            });
            
            const span = document.getElementById(`ev-total-${idx}`);
            if (span) {
                span.textContent = `(${total}/${isChampionsMode() ? 66 : 510})`;
                // 510なら青太字、それ以外はデフォルト色
                if (total === (isChampionsMode() ? 66 : 510)) {
                    span.style.color = '#2a64a3';
                    span.style.fontWeight = 'bold';
                } else {
                    span.style.color = '#aaa';
                    span.style.fontWeight = 'normal';
                }
            }
        }

        // PokéPaste (英語) 一括読み込み
        function parseAndFillPokePasteBulk(text) {
            const blocks = text.split(/\n\s*\n/);
            let count = 0;

            for (let i = 0; i < blocks.length && i < 6; i++) {
                const block = blocks[i].trim();
                if (!block) continue;
                
                const idx = i + 1;
                const lines = block.split('\n');
                
                let name = '', item = '', ability = '', tera = '', nature = '';
                let evs = {}; 
                let ivs = {};
                let moves = [];

                lines.forEach(line => {
                    line = line.trim();
                    if (!line) return;

                    if (!name && !item && !line.includes(':') && !line.startsWith('-')) {
                        if (line.includes('@')) {
                            const parts = line.split('@');
                            name = parts[0].trim();
                            item = parts[1].trim();
                        } else {
                            name = line.trim();
                        }
                    }
                    else if (line.startsWith('Ability:')) {
                        ability = line.split(':')[1].trim();
                    }
                    else if (line.startsWith('Tera Type:')) {
                        tera = line.split(':')[1].trim();
                    }
                    else if (line.endsWith('Nature')) {
                        nature = line.replace('Nature', '').trim();
                    }
                    else if (line.startsWith('EVs:')) {
                        const parts = line.split(':')[1].split('/');
                        parts.forEach(p => {
                            p = p.trim();
                            const match = p.match(/^(\d+)\s+(\w+)/);
                            if (match) {
                                const val = match[1];
                                const statName = match[2];
                                const statKey = REV_STAT_MAP[statName];
                                if (statKey) evs[statKey] = val;
                            }
                        });
                    }
                    else if (line.startsWith('IVs:')) {
                        const parts = line.split(':')[1].split('/');
                        parts.forEach(p => {
                            p = p.trim();
                            const match = p.match(/^(\d+)\s+(\w+)/);
                            if (match) {
                                const val = match[1];
                                const statName = match[2];
                                const statKey = REV_STAT_MAP[statName];
                                if (statKey) ivs[statKey] = val;
                            }
                        });
                    }
                    else if (line.startsWith('-')) {
                        const m = line.substring(1).trim();
                        if (moves.length < 4) moves.push(m);
                    }
                });

                let searchName = name;
                searchName = searchName.replace(/\s*\([MF]\)$/, '').trim();
                if (searchName.endsWith(')') && searchName.includes('(')) {
                    const match = searchName.match(/\(([^)]+)\)$/); 
                    if(match) {
                        searchName = match[1];
                    }
                }
                
                document.getElementById(`name-${idx}`).value = reverseTranslate(searchName, 'pokemon');

                if (item) document.getElementById(`item-${idx}`).value = reverseTranslate(item, 'items');
                if (ability) document.getElementById(`ability-${idx}`).value = reverseTranslate(ability, 'abilities');
                if (tera) document.getElementById(`tera-${idx}`).value = reverseTranslate(tera, 'types');
                
                // 性格 (補正情報付きでセット)
                const jpNature = reverseTranslate(nature, 'natures');
                if (NATURE_STATS[jpNature]) {
                    document.getElementById(`nature-${idx}`).value = jpNature + " " + NATURE_STATS[jpNature];
                } else {
                    document.getElementById(`nature-${idx}`).value = jpNature;
                }

                // 努力値 / 能力ポイント（選択中の方式に応じて制限）
                let currentTotalEV = 0;
                STAT_LABELS.forEach(stat => { 
                    const input = document.querySelector(`input[name="ev-${stat}-${idx}"]`);
                    input.value = ''; 
                    if (evs[stat]) {
                        let val = parseInt(evs[stat]);
                        if (val > (isChampionsMode() ? 32 : 252)) val = isChampionsMode() ? 32 : 252;
                        if (currentTotalEV + val > 510) {
                            val = 510 - currentTotalEV;
                        }
                        if (val > 0) {
                            input.value = val;
                            currentTotalEV += val;
                        }
                    }
                });
                updateEVTotal(idx); // ★ 合計表示更新

                STAT_LABELS.forEach(stat => { document.querySelector(`input[name="iv-${stat}-${idx}"]`).value = '31'; });
                Object.keys(ivs).forEach(stat => {
                    document.querySelector(`input[name="iv-${stat}-${idx}"]`).value = ivs[stat];
                });

                for(let m=0; m<4; m++) {
                    const moveInput = document.getElementById(`move-${m+1}-${idx}`);
                    moveInput.value = '';
                    if (moves[m]) {
                        moveInput.value = reverseTranslate(moves[m], 'moves');
                    }
                }
                count++;
            }
            alert(`${count}匹分のPokéPasteを読み込みました！`);
        }

        // ポケソル (日本語) 個別読み込み
        function parseAndFillOnePokemon(text, idx) {
            const lines = text.trim().split('\n');
            let name = '', item = '', ability = '', tera = '', nature = '';
            let evs = {}; 
            let ivs = {}; 
            let moves = [];

            lines.forEach(line => {
                line = line.trim();
                if(!line) return;

                if (line.includes('@')) {
                    const parts = line.split('@');
                    name = parts[0].trim();
                    item = parts[1].trim();
                } 
                else if (line.match(/^(特性|Ability)[:：]\s*(.+)$/i)) {
                    ability = line.match(/^(特性|Ability)[:：]\s*(.+)$/i)[2];
                } 
                else if (line.match(/^(テラスタイプ|Tera Type)[:：]\s*(.+)$/i)) {
                    tera = line.match(/^(テラスタイプ|Tera Type)[:：]\s*(.+)$/i)[2];
                } 
                else if (line.match(/^(性格|Nature)[:：]\s*(.+)$/i)) {
                    nature = line.match(/^(性格|Nature)[:：]\s*(.+)$/i)[2];
                }
                else if (line.match(/\d+[\s-]+\d+/)) {
                    const ivMatch = line.match(/\*([HABCDS])(\d+)/g);
                    if (ivMatch) {
                        ivMatch.forEach(m => {
                            const statChar = m.charAt(1); 
                            const val = m.substring(2);
                            ivs[statChar] = val;
                        });
                    }
                    const statOrder = ['H', 'A', 'B', 'C', 'D', 'S'];
                    const parts = line.split(/[\s-]+/); 
                    let statIndex = 0;
                    parts.forEach(part => {
                        const match = part.match(/\((\d+)\)/);
                        if (match && statIndex < 6) evs[statOrder[statIndex]] = match[1];
                        if (part.match(/^\d/)) statIndex++;
                    });
                } 
                else if (line.includes('/') || (!line.match(/[0-9]+/) && line.length > 1)) {
                    if(line.includes('/')) {
                        const splitted = line.split('/');
                        splitted.forEach(m => moves.push(m.trim()));
                    } else if(moves.length < 4) {
                        moves.push(line);
                    }
                }
                else if (!name && !item && !line.includes(':') && !line.match(/[0-9]+/)) {
                    name = line;
                }
            });

            if(name) document.getElementById(`name-${idx}`).value = name;
            if(item) document.getElementById(`item-${idx}`).value = item;
            if(ability) document.getElementById(`ability-${idx}`).value = ability;
            if(tera) document.getElementById(`tera-${idx}`).value = tera;
            
            // ★ 性格 (補正情報付きでセット)
            if (NATURE_STATS[nature]) {
                document.getElementById(`nature-${idx}`).value = nature + " " + NATURE_STATS[nature];
            } else {
                document.getElementById(`nature-${idx}`).value = nature;
            }

            // 努力値 / 能力ポイント（選択中の方式に応じて制限）
            let currentTotalEV = 0;
            STAT_LABELS.forEach(stat => { 
                const input = document.querySelector(`input[name="ev-${stat}-${idx}"]`);
                input.value = ''; 
                if (evs[stat]) {
                    let val = parseInt(evs[stat]);
                    if (val > (isChampionsMode() ? 32 : 252)) val = isChampionsMode() ? 32 : 252;
                    if (currentTotalEV + val > 510) {
                        val = 510 - currentTotalEV;
                    }
                    if (val > 0) {
                        input.value = val;
                        currentTotalEV += val;
                    }
                }
            });
            updateEVTotal(idx); // ★ 合計表示更新

            STAT_LABELS.forEach(stat => { document.querySelector(`input[name="iv-${stat}-${idx}"]`).value = '31'; });
            Object.keys(ivs).forEach(stat => {
                const input = document.querySelector(`input[name="iv-${stat}-${idx}"]`);
                if(input) input.value = ivs[stat];
            });

            for(let m=0; m<4; m++) {
                document.getElementById(`move-${m+1}-${idx}`).value = '';
            }
            for(let m=0; m<4 && m<moves.length; m++) {
                document.getElementById(`move-${m+1}-${idx}`).value = moves[m];
            }
        }

        // === 4. 基本機能 (入力制限, 翻訳生成) ===
        document.querySelectorAll('.ev-input').forEach(input => {
            // キーボード矢印操作
            input.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    const max = isChampionsMode() ? 32 : 252;
                    const step = isChampionsMode() ? 1 : 4;
                    let val = parseInt(this.value) || 0;
                    val = e.key === 'ArrowUp' ? Math.min(max, val + step) : Math.max(0, val - step);
                    this.value = val;
                    this.dispatchEvent(new Event('input'));
                }
            });

                        // 手動入力制限 (252制限 & 510制限)
            input.addEventListener('input', function() {
                if (this.value === '') {
                    updateEVTotal(this.name.split('-')[2]); // 空でも合計更新
                    return;
                }

                let val = parseInt(this.value);
                if (isNaN(val)) return;

                if (val < 0) val = 0;
                if (val > (isChampionsMode() ? 32 : 252)) val = isChampionsMode() ? 32 : 252;

                const parts = this.name.split('-');
                const index = parts[2];
                let otherTotal = 0;
                document.querySelectorAll(`.ev-input[name$="-${index}"]`).forEach(el => {
                    if (el !== this) {
                        otherTotal += parseInt(el.value) || 0;
                    }
                });

                const maxAllowed = (isChampionsMode() ? 66 : 510) - otherTotal;
                if (val > maxAllowed) {
                    val = maxAllowed;
                }

                if (parseInt(this.value) !== val) {
                    this.value = val;
                }
                
                // ★ 合計表示を更新
                updateEVTotal(index);
            });
        });

        document.querySelectorAll('.iv-input').forEach(input => {
            input.addEventListener('input', function() { if(this.value > 31) this.value = 31; });
        });

        function translate(text, type) {
            if (!text) return '';
            
            // ★ 性格の場合、補正情報を除去して検索
            if (type === 'natures') {
                text = text.split(' ')[0];
            }

            if (typeof TRANSLATION_DATA === 'undefined') return text;
            const dict = TRANSLATION_DATA[type];
            return (dict && dict[text]) ? dict[text] : text;
        }

        document.getElementById('generate-button').addEventListener('click', () => {
            let fullOutput = '';
            for (let i = 1; i <= 6; i++) {
                const jpName = document.getElementById(`name-${i}`).value.trim();
                if (!jpName) continue;

                const enName = translate(jpName, 'pokemon');
                const jpItem = document.getElementById(`item-${i}`).value.trim();
                const enItem = translate(jpItem, 'items');
                
                let block;
                if (isChampionsMode()) {
                    block = `【${jpName}】\\n`;
                    const abilityJP = document.getElementById(`ability-${i}`).value.trim();
                    if (abilityJP) block += `特性: ${abilityJP}\\n`;
                    const natureJP = document.getElementById(`nature-${i}`).value.trim();
                    if (natureJP) block += `性格: ${natureJP.split(' ')[0]}\\n`;
                    const pointNames = {H:'HP', A:'攻撃', B:'防御', C:'特攻', D:'特防', S:'素早さ'};
                    const points = [];
                    let totalPoints = 0;
                    STAT_LABELS.forEach(stat => {
                        const val = parseInt(document.querySelector(`input[name="ev-${stat}-${i}"]`).value) || 0;
                        totalPoints += val;
                        if (val > 0) points.push(`${pointNames[stat]} ${val}`);
                    });
                    block += `能力ポイント: ${points.length ? points.join(' / ') : '未配分'}\\n`;
                    block += `合計: ${totalPoints}/66\\n`;
                    const movesJP = [];
                    for (let m = 1; m <= 4; m++) {
                        const move = document.getElementById(`move-${m}-${i}`).value.trim();
                        if (move) movesJP.push(`- ${move}`);
                    }
                    if (movesJP.length) block += movesJP.join('\\n') + '\\n';
                    fullOutput += block + '\\n';
                    continue;
                }
                block = `${enName}`;
                if (enItem) block += ` @ ${enItem}`;
                block += '\\n';

                const jpAbility = document.getElementById(`ability-${i}`).value.trim();
                if (jpAbility) block += `Ability: ${translate(jpAbility, 'abilities')}\n`;

                block += `Level: 50\n`;

                const jpTera = document.getElementById(`tera-${i}`).value.trim();
                if (jpTera) block += `Tera Type: ${translate(jpTera, 'types')}\n`;

                let evsList = [];
                STAT_LABELS.forEach(stat => {
                    const val = document.querySelector(`input[name="ev-${stat}-${i}"]`).value;
                    if (val && parseInt(val) > 0) evsList.push(`${val} ${STAT_MAP[stat]}`);
                });
                if (evsList.length > 0) block += `EVs: ${evsList.join(' / ')}\n`;

                const jpNature = document.getElementById(`nature-${i}`).value.trim();
                if (jpNature) block += `${translate(jpNature, 'natures')} Nature\n`;

                let ivsList = [];
                STAT_LABELS.forEach(stat => {
                    const val = document.querySelector(`input[name="iv-${stat}-${i}"]`).value;
                    if (val !== '' && parseInt(val) !== 31) ivsList.push(`${val} ${STAT_MAP[stat]}`);
                });
                if (ivsList.length > 0) block += `IVs: ${ivsList.join(' / ')}\n`;

                for (let m = 1; m <= 4; m++) {
                    const jpMove = document.getElementById(`move-${m}-${i}`).value.trim();
                    if (jpMove) block += `- ${translate(jpMove, 'moves')}\n`;
                }
                fullOutput += block + '\n';
            }
            document.getElementById('output-code').value = fullOutput.trim();
        });

        document.getElementById('copy-button').addEventListener('click', () => {
            document.getElementById("output-code").select();
            document.execCommand("copy");
            alert("コピーしました！");
        });
        updateTrainingModeUI();
    </script>
</body>
